<!DOCTYPE html>
<html lang="te"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}.bigh{text-align:center;font-size:32px;color:#138f9a;margin:20px 0 10px}.sech{text-align:center;font-size:24px;color:#138f9a;margin:34px 0 10px;border-top:2px solid #138f9a33;padding-top:20px}body{font-family:system-ui,sans-serif;margin:0;background:#f3f4f8;color:#1c1c28}
header{background:#138f9a;text-align:center}header img{width:100%;max-width:720px;display:block;margin:auto}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}
nav button{flex:1;padding:12px;border:0;background:none;font-size:15px;cursor:pointer}
nav button.on{border-bottom:3px solid #138f9a;font-weight:700;color:#138f9a}
main{max-width:720px;margin:auto;padding:14px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px #0002}
label{display:block;font-size:13px;margin:12px 0 4px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:7px;font-size:15px}
h3{margin:18px 0 0;font-size:15px;color:#138f9a}
.btn{background:#138f9a;color:#fff;border:0;padding:11px 18px;border-radius:7px;font-size:15px;cursor:pointer;margin:14px 6px 0 0}
.btn.g{background:#555}.btn:disabled{opacity:.5}
.row{display:flex;gap:12px;align-items:center;background:#fff;padding:10px;border-radius:10px;margin-top:10px;cursor:pointer;box-shadow:0 1px 3px #0002}
.row img,.ph{width:52px;height:64px;object-fit:cover;border-radius:6px;background:#ddd}
.big{width:150px;height:190px;object-fit:cover;border-radius:8px;background:#ddd}
table{width:100%;margin-top:12px;border-collapse:collapse}td{padding:7px 4px;border-bottom:1px solid #eee;font-size:14px}td:first-child{color:#666;width:42%}
#msg{position:fixed;top:0;left:0;right:0;z-index:9;padding:14px;font-weight:600;text-align:center;display:none;box-shadow:0 2px 6px #0004}
.top{display:flex;gap:8px}
</style></head><body>
